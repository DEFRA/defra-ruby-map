name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test "spec/javascripts/**/*.test.js"

  vendor-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run vendor
      # Fails if committed vendor/ files drift from what the locked package versions produce
      - run: git add -N vendor/ && git diff --exit-code -- vendor/

  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of sonarcloud analysis
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Generate the lint and coverage reports the scanner reads (see
      # sonar-project.properties)
      - run: bundle exec rubocop --format progress --format json --out rubocop-result.json
      - run: bundle exec rspec
      - run: npm ci
      - run: npm run test:coverage
      - name: Analyze with SonarCloud
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub
          SONAR_TOKEN: ${{ secrets.RUBY_SONAR_TOKEN }} # Needs to be set in the repo; settings -> secrets
